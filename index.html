<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find every word you can spell from a set of letters — a helper for the Letterpress word game."
    />
    <title>Letterpress Cheat</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Letterpress Cheat</h1>
        <p class="app__subtitle">
          Type the letters from the board and find every word you can spell.
        </p>
      </header>

      <form class="controls" autocomplete="off">
        <label class="field">
          <span class="field__label">Letters</span>
          <input
            id="letters"
            name="letters"
            type="text"
            inputmode="latin"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type all the letters on the board"
            disabled
          />
        </label>

        <label class="field">
          <span class="field__label">Required letters <span class="field__hint">(optional)</span></span>
          <input
            id="required"
            name="required"
            type="text"
            inputmode="latin"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Letters that must appear in every word"
            disabled
          />
        </label>
      </form>

      <p id="status" class="status" role="status">Loading dictionary…</p>

      <ul id="results" class="results" aria-live="polite"></ul>
    </main>

    <footer class="footer">
      <a href="https://github.com/romaklimenko/cheat">Source</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/atebits/Words">Dictionary</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
